<body>
<div class="wrap">
    <a class="back" href="product/index.html">← К товару</a>
    <h1>Оформление заказа</h1>
    <p class="lead">Форма несёт <code>id="checkout"</code> и уходит на страницу благодарности.</p>

    <form id="checkout" method="get" action="thanks.html">
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" value="Тестовый покупатель">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="test@example.com">

        <label for="sum">Сумма заказа, ₽</label>
        <input id="sum" name="sum" type="number" value="1500" readonly>

        <div class="total"><span>К оплате</span><b>1500 ₽</b></div>
        <button type="submit">Оформить заказ</button>
    </form>

    <div class="note">
        Кейс 1, шаг 4: если в триггере «Отправка формы» задать время ожидания активации,
        переход на следующую страницу задержится — в журнале это видно по времени событий.
    </div>
</div>

<script>
    /* Автопроход: checkout.html?auto=hold — форма отправляется, но переход задерживается, чтобы журнал успел записать запрос */
    if (/[?&]auto=hold/.test(location.search)) {
        document.getElementById('checkout').addEventListener('submit', function (e) { e.preventDefault(); });
        setTimeout(function () { document.getElementById('checkout').requestSubmit(); }, 1500);
    }
</script>

<!-- Журнал событий стенда -->

</body>
